<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/><stop offset="1" stop-color="#d9eefb"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fae5b"/><stop offset="1" stop-color="#2f6b3a"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#d8302a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <path d="M0 300 Q140 262 256 290 T512 276 L512 512 L0 512Z" fill="url(#grass)"/>
  <path d="M0 356 Q160 322 300 348 T512 336 L512 512 L0 512Z" fill="#2b5f34" opacity=".55"/>
  <!-- flag -->
  <rect x="252" y="150" width="7" height="188" rx="3.5" fill="#f3f7f4"/>
  <path d="M259 152 L372 186 L259 224 Z" fill="url(#flag)"/>
  <!-- ball with motion streak -->
  <g transform="translate(186 372)">
    <ellipse cx="0" cy="30" rx="34" ry="9" fill="#1f4a2a" opacity=".35"/>
    <circle cx="0" cy="0" r="30" fill="#ffffff"/>
    <circle cx="8" cy="7" r="22" fill="#e3ece6"/>
    <circle cx="-4" cy="-4" r="30" fill="#fff" opacity=".9"/>
    <path d="M46 -6 q34 12 66 2" stroke="#ffd666" stroke-width="8" fill="none" stroke-linecap="round" opacity=".95"/>
  </g>
  <!-- launch-monitor aperture mark -->
  <g transform="translate(408 108)" opacity=".9">
    <circle r="34" fill="none" stroke="#0e3b24" stroke-width="9"/>
    <circle r="12" fill="#0e3b24"/>
  </g>
</svg>
